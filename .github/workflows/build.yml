name: Check Gradle Tasks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Check Available Gradle Tasks
      run: |
        GRADLE_DIR=$(find . -name "build.gradle" -not -path "*/app/*" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLE_DIR")
        cd "$PROJECT_DIR"
        gradle tasks --all
