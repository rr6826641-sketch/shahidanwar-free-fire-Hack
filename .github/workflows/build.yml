name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Move Files to Root
      run: |
        unzip -o *.zip || true
        # Agar zip kisi subfolder mein extract hui hai toh us ki files root par le aao
        find . -maxdepth 3 -name "settings.gradle" -execdir cp -r ./* . \; || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        # Main project directory jahan settings.gradle pari hai
        SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_DIR"
        gradle assembleDebug || gradle build

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
