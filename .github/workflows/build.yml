name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Files
      run: |
        unzip -o *.zip || true

    - name: Check Extracted Files
      run: |
        echo "=== ALL FILES IN WORKSPACE ==="
        find . -maxdepth 3 -not -path '*/.*'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        # Find directory containing settings.gradle or build.gradle
        TARGET_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        fi
        echo "Building in directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/*.apk"
